# Builds and publishes the phone web app (GitHub Pages) every 20 minutes:
# the feeds are read here, because phone browsers are not allowed to read
# most of them directly, and published beside the app as one small file per
# category. Turn on once with: lowpingnews web
#
# Hardened: each job holds only the rights it needs - the build job, which
# reads data from dozens of outside feeds, can read the repository and
# nothing more; only the deploy job may publish. Every action is pinned to an
# exact commit (its version in the comment), so a moved tag cannot swap code.
name: web

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - name: Compile the app and test its logic
        run: |
          npx -y -p typescript@5.6.3 tsc -p web/tsconfig.json
          npx -y -p typescript@5.6.3 tsc -p web/tsconfig.sw.json
          npx -y -p typescript@5.6.3 tsc -p web/tsconfig.reader.json
          node web/test/core.test.mjs
          node web/test/reader.test.mjs
          node web/test/sw.test.mjs
      - name: Keep the feed cache between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/news
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Read the feeds and build the site
        env:
          LPN_READER_URL: ${{ vars.READER_URL }}
        run: python3 web/build_digest.py web/site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: web/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
